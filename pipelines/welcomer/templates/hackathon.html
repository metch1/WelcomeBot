<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon: #00ff9c;
            --muted: rgba(180, 255, 230, .5);
            --dim: rgba(0, 255, 156, .25)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'JetBrains Mono', monospace
        }

        body {
            width: 1000px;
            height: 400px;
            background: #020404;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .browser {
            width: 960px;
            height: 380px;
            background: #0b1212;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .8), inset 0 0 0 1px var(--dim)
        }

        .bar {
            height: 34px;
            background: linear-gradient(180deg, #121a1a, #0e1515);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 15px;
            border-bottom: 1px solid var(--dim)
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%
        }

        .r {
            background: #ff5f56
        }

        .y {
            background: #ffbd2e
        }

        .g {
            background: #27c93f
        }

        .addr {
            flex: 1;
            background: rgba(0, 0, 0, .35);
            border: 1px solid var(--dim);
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 11px;
            color: var(--muted)
        }

        .term {
            position: relative;
            height: calc(100% - 34px);
            padding: 22px 34px 28px;
            background: radial-gradient(circle at 30% 20%, rgba(0, 255, 156, .05), transparent 60%), #050808;
            box-shadow: inset 0 0 50px rgba(0, 255, 156, .05);
            display: flex;
            flex-direction: column
        }

        .term::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .03), rgba(255, 255, 255, .03) 1px, transparent 1px, transparent 3px)
        }

        .head {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--dim);
            padding-bottom: 12px;
            flex-shrink: 0
        }

        .head .glow {
            color: var(--neon);
            text-shadow: 0 0 6px rgba(0, 255, 156, .6), 0 0 14px rgba(0, 255, 156, .25)
        }

        .cur {
            animation: blink 1s steps(2) infinite
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        .row {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 34px
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%
        }

        .log {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.9
        }

        .log b {
            color: var(--neon);
            font-weight: 500
        }

        .headline {
            margin-top: 22px;
            font-size: 30px;
            font-weight: 700;
            color: var(--neon);
            text-shadow: 0 0 10px rgba(0, 255, 156, .35)
        }

        .headline .name {
            color: #4fc3ff;
            text-shadow: none
        }

        .fact {
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--muted);
            line-height: 1.7
        }

        .fact b {
            color: var(--neon);
            font-weight: 500
        }

        .meta {
            margin-top: auto;
            padding-top: 20px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.9
        }

        .meta b {
            color: #4fc3ff;
            font-weight: 500
        }

        .frame {
            width: 104px;
            height: 104px;
            flex-shrink: 0;
            border: 2px solid var(--neon);
            padding: 4px;
            box-shadow: 0 0 16px rgba(0, 255, 156, .25)
        }

        .frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: grayscale(.15) contrast(1.05)
        }
    </style>
</head>

<body>
    <div class="browser">
        <div class="bar">
            <div class="dot r"></div>
            <div class="dot y"></div>
            <div class="dot g"></div>
            <div class="addr">collex.local/session</div>
        </div>
        <div class="term">
            <div class="head"><span class="glow">COLLEX_NET v4.7</span><span>STATUS: CONNECTED<span
                        class="cur">▮</span></span></div>
            <div class="row">
                <div class="col">
                    <div class="log">&gt; authenticating user... <b>OK</b><br>&gt; syncing profile... <b>OK</b></div>
                    <div class="headline">welcome, <span class="name">{{USERNAME}}</span>_</div>
                    <div class="fact">did you know: <b>the first computer bug</b> was an actual moth stuck in a relay,
                        1947.</div>
                    <div class="meta">session id: <b>{{USER_ID}}</b> &nbsp;|&nbsp; nodes online: <b>{{MEMBER_COUNT}}</b>
                    </div>
                </div>
                <div class="frame"><img src="{{AVATAR_URL}}"></div>
            </div>
        </div>
    </div>
</body>

</html>
