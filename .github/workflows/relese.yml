name: Release
on:
    push:
        tags:
            - "v*"
jobs:
    build:
        strategy:
            matrix:
                include:
                    - rid: win-x64
                      os_name: windows
                    - rid: linux-x64
                      os_name: linux
                    - rid: osx-arm64
                      os_name: macos-silicon
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
            - name: Publish
              run: dotnet publish -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}
            - name: Stage bundle
              run: |
                  mkdir -p bundle/pipelines/welcomer
                  cp publish/${{ matrix.rid }}/WelcomeBot* bundle/ 2>/dev/null || true
                  rm -f bundle/*.pdb
                  cp pipelines/welcomer/welcome.html bundle/pipelines/welcomer/welcome.html
                  cp .env.example bundle/.env
            - name: Zip
              run: |
                  cd bundle
                  zip -r ../WelcomeBot-${{ matrix.os_name }}.zip .
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: WelcomeBot-${{ matrix.os_name }}
                  path: WelcomeBot-${{ matrix.os_name }}.zip
    release:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  path: artifacts
            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/**/*.zip
